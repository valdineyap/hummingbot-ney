[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[build-system]
requires = ["setuptools", "wheel", "numpy>=2.2.6", "cython>=3.0.12"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py313"
# Ruff doesn't process .pyx/.pxd (covered by the legacy flake8 toolchain only).
extend-exclude = ["*.pyx", "*.pxd"]

[tool.ruff.lint]
# Mirror .flake8 (E251, E501, E702, W504, W503).
# W503/W504 aren't implemented in ruff (PEP 8 strict), so they're omitted.
ignore = ["E251", "E501", "E702"]
# pycodestyle (E,W) + pyflakes (F) = same surface as flake8 default.
select = ["E", "W", "F"]

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
conda_env = "hummingbot"
filter_files = true
skip = ["setup.py"]
