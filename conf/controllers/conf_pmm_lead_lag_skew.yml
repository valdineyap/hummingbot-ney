# PMM Lead-Lag Skew — Fase 1 config
# BTC-BRL on Binance Spot (Hummingbot V2)
#
# Fase 1: PMM puro, sem skew, sem regime filter, sem lead-lag.
# Ajustar para Fases 2–5 conforme roadmap em §6 do plano.

controller_name: pmm_lead_lag_skew
id: pmm_btc_brl

# ── Connector ──────────────────────────────────────────────────────────────
connector_name: binance
trading_pair: BTC-BRL
leverage: 1

# ── Capital e níveis (Fase 1) ─────────────────────────────────────────────
total_amount_quote: 200          # R$200 inicial; aumentar gradualmente após validação
buy_spreads:  [0.0010, 0.0020]  # 10 bps e 20 bps
sell_spreads: [0.0010, 0.0020]
buy_amounts_pct:  [50, 50]       # 50% cada nível
sell_amounts_pct: [50, 50]

# ── Executor ──────────────────────────────────────────────────────────────
# Testar 15s, 30s, 60s — ver §8.3 do plano; 60s é ponto de partida.
executor_refresh_time: 60
cooldown_time: 15

# ── Triple barrier — PMM puro (sem SL/TP) ────────────────────────────────
stop_loss: null
take_profit: null
time_limit: null

# ── Rebalance spot ────────────────────────────────────────────────────────
# MARKET rebalance fura o breakeven (taker=4bps) — desabilitado.
position_rebalance_threshold_pct: 0.25
skip_rebalance: true

# ── Inventário (Fase 2) ──────────────────────────────────────────────────
target_inventory_base_pct: 0.5
inv_soft_band: 0.10              # zona neutra de skew (size factor = 1.0)
inv_hard_band: 0.20              # size factor adversa = 0; favorável = 1.5; retorno do one-sided
inv_hard_cap:  0.30              # trigger one-sided (entrada; saída em hard_band — histeresis)
inv_kill:      0.40              # kill switch L3
max_net_position_quote: 60       # ~30% de R$200 — hard cap absoluto em BRL

# ── Skew (Fase 3) ────────────────────────────────────────────────────────
w_inv: 1.0
w_lead: 0.0                      # lead-lag desligado até Fase 5
skew_max_bps: 2                  # Fase3=2; subir para 4 com evidência empírica; teto absoluto=8
min_maker_distance_bps: 1
min_requote_bps: 1               # piso para refresh natural (evita churn)
force_requote_bps: 15            # teto para escape de ordem stale em mercado rápido

# ── Volatilidade (Fase 3) ────────────────────────────────────────────────
candles_connector: binance       # blank → mesmo connector_name
candles_trading_pair: BTC-BRL    # blank → mesmo trading_pair
candles_interval: 1m
vol_short_length: 30             # 30 minutos para σ de curto prazo
vol_ref_length:   360            # 6h para σ de referência

# ── Lead-lag (Fase 5) ────────────────────────────────────────────────────
basis_deadband_bps: 3
max_leader_staleness_sec: 5
max_usdt_brl_staleness_sec: 15

# Leader (BTC-USDT) e taxa de câmbio (USDT-BRL); blank → mesmo connector_name
leader_connector: binance
leader_trading_pair: BTC-USDT
quote_rate_connector: binance
quote_rate_trading_pair: USDT-BRL

# Micro pause (1–5s, BTCUSDT puro)
lead_micro_window_sec: 5
lead_micro_threshold_bps: 5
lead_micro_dwell_sec: 3

# Regime sintético (30s–5min, fair_brl smoothed por EWM)
lead_lag_short_window_sec: 30
lead_lag_ewm_halflife_sec: 10
lead_lag_z_window_sec:     600

# ── Regime + kill switch (Fase 4) ────────────────────────────────────────
vol_degraded_threshold_mult: 3.0   # vol_ratio acima → degraded (size 0.5×, spread 1.5×)
vol_pause_threshold_mult:    5.0   # vol_ratio acima → paused (cancela tudo, dwell 60s)
pause_basis_bps:             30.0  # |basis| acima → paused
pause_release_sec:           60.0  # dwell mínimo antes de sair de paused
safe_mode_entry_sec:         120.0 # tempo contínuo em L1 para escalar a safe (L1.5)
safe_thrash_window_sec:      600.0 # janela para detecção de thrashing degraded↔paused
max_session_drawdown_quote:  10    # session_pnl < -X em quote → kill (manual restart)
critical_error_threshold:    5     # reservado para Fase 4+ — counter de erros críticos
